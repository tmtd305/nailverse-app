<!doctype html>
<html lang="en">

<style>html,body{margin:0;background:#0A0A0B;overflow-x:hidden;}*{box-sizing:border-box;}a{text-decoration:none;color:inherit;}::-webkit-scrollbar{display:none;}</style>
</head>
<body>
<div style="width:100%;max-width:430px;margin:0 auto;height:100vh;height:100dvh;background:#0A0A0B;font-family:'Inter',sans-serif;color:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="flex-shrink:0;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:absolute;top:0;left:0;right:0;z-index:5;">

      </div>
      <div style="flex:1;height:230px;display:flex;flex-direction:column;gap:2px;overflow:hidden;">
        <div style="height:114px;overflow:hidden;">
          <img src="images/ig-post2.jpg" loading="lazy" style="display:block;width:100%;height:114px;object-fit:cover;">
        </div>
        <div style="height:114px;position:relative;overflow:hidden;">
          <img src="images/ig-post5.jpg" loading="lazy" style="display:block;width:100%;height:114px;object-fit:cover;">
          <a href="#dish" onclick="event.preventDefault();document.getElementById('grid-section').scrollIntoView({behavior:'smooth'})" style="position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;">+42</a>
        </div>
      </div>
    </div>

    <div style="padding:0 20px;">
      <div style="display:flex;align-items:center;gap:10px;margin-top:-28px;position:relative;z-index:2;">

          <div style="display:flex;align-items:center;gap:5px;">
            <span style="font-size:17px;font-weight:800;">2Cute Nails</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#3B82F6"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6" stroke="#fff" stroke-width="2" fill="none"/></svg>
          </div>
          <div style="font-size:11.5px;color:#A9A9B0;">📍 Miami, FL</div>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;margin:16px 0;text-align:center;">
        <div><div style="font-size:15px;font-weight:800;">328</div><div style="font-size:10.5px;color:#8B8B92;">Posts</div></div>
        <div><div style="font-size:15px;font-weight:800;">12.4K</div><div style="font-size:10.5px;color:#8B8B92;">Followers</div></div>
        <div><div style="font-size:15px;font-weight:800;display:flex;align-items:center;gap:3px;justify-content:center;"><span style="color:#FF2E9E;">★</span>5.0</div><div style="font-size:10.5px;color:#8B8B92;">328 reviews</div></div>
        <div><div style="font-size:15px;font-weight:800;">3 yrs</div><div style="font-size:10.5px;color:#8B8B92;">Experience</div></div>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;">
        <span style="background:#18181B;color:#C9C9CF;font-size:11px;font-weight:600;padding:6px 11px;border-radius:100px;">Acrylic</span>
        <span style="background:#18181B;color:#C9C9CF;font-size:11px;font-weight:600;padding:6px 11px;border-radius:100px;">Gel</span>
        <span style="background:#18181B;color:#C9C9CF;font-size:11px;font-weight:600;padding:6px 11px;border-radius:100px;">Nail Art</span>
        <span style="background:#18181B;color:#C9C9CF;font-size:11px;font-weight:600;padding:6px 11px;border-radius:100px;">French</span>
        <span style="background:#18181B;color:#C9C9CF;font-size:11px;font-weight:600;padding:6px 11px;border-radius:100px;">Custom Designs</span>
      </div>

      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <a href="service.html" style="flex:1;background:#FF2E9E;color:#fff;font-size:14px;font-weight:700;text-align:center;padding:13px 0;border-radius:12px;box-shadow:0 10px 24px rgba(255,46,158,0.4);">Book Now</a>

      <div style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:18px;">

        <span style="display:flex;align-items:center;gap:4px;color:#8B8B92;font-size:10.5px;font-weight:600;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8B8B92" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Responds in ~10 min</span>
        <span style="display:flex;align-items:center;gap:4px;color:#8B8B92;font-size:10.5px;font-weight:600;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8B8B92" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Free cancel 24h+</span>
      </div>

      <p style="font-size:12.5px;line-height:1.5;color:#A9A9B0;margin:0 0 18px 0;">Specializing in luxury sets ✨ By appointment only.</p>
    </div>

    <div id="grid-section" style="display:flex;gap:22px;border-top:1px solid #1E1E21;padding:12px 20px 0 20px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5A5A60" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5A5A60" stroke-width="2"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v3"/></svg>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:2px;padding-top:10px;">
      <img src="images/ig-post3.jpg" loading="lazy" style="width:100%;aspect-ratio:1/1;object-fit:cover;">
      <img src="images/ig-post6.jpg" loading="lazy" style="width:100%;aspect-ratio:1/1;object-fit:cover;">
      <img src="images/ig-post4.jpg" loading="lazy" style="width:100%;aspect-ratio:1/1;object-fit:cover;">
      <img src="images/ig-post1.jpg" loading="lazy" style="width:100%;aspect-ratio:1/1;object-fit:cover;">
      <img src="images/ig-post2.jpg" loading="lazy" style="width:100%;aspect-ratio:1/1;object-fit:cover;">
      <img src="images/ig-post5.jpg" loading="lazy" style="width:100%;aspect-ratio:1/1;object-fit:cover;">
    </div>

  </div>

</div>
