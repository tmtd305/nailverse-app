<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Nailverse — Pick a Time</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0A0A0B"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<script src="notifications.js"></script>
<style>
  html,body{margin:0;background:#0A0A0B;overflow-x:hidden;}
  *{box-sizing:border-box;}
  a{text-decoration:none;color:inherit;}
  .date-chip{background:#18181B;border:1.5px solid #232326;border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;flex:1;}
  .date-chip.on{background:#FF2E9E;border-color:#FF2E9E;}
  .slot{background:#18181B;border:1.5px solid #232326;border-radius:12px;padding:12px 0;text-align:center;font-size:13px;font-weight:700;cursor:pointer;}
  .slot.on{background:#FF2E9E;border-color:#FF2E9E;}
  .slot.off{opacity:0.35;pointer-events:none;}
</style>
</head>
<body>
<div style="width:100%;max-width:430px;margin:0 auto;height:100vh;height:100dvh;background:#0A0A0B;font-family:'Inter',sans-serif;color:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="flex-shrink:0;padding:18px 20px 6px 20px;">
    <a href="service.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span style="display:block;font-size:11px;font-weight:700;color:#FF2E9E;margin-top:14px;">STEP 2 OF 3</span>
    <h1 style="font-size:22px;font-weight:800;margin:6px 0 4px 0;">Pick a Time</h1>
    <p id="svc-sub" style="font-size:12.5px;color:#A9A9B0;margin:0;">Select a date and time that works for you</p>
  </div>

  <div style="flex:1;overflow-y:auto;padding:16px 20px;">
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <div class="date-chip on" data-date="Today, Sep 22" onclick="pickDate(this)">
        <div style="font-size:11px;color:#A9A9B0;">TODAY</div>
        <div style="font-size:15px;font-weight:800;">22</div>
      </div>
      <div class="date-chip" data-date="Wed, Sep 23" onclick="pickDate(this)">
        <div style="font-size:11px;color:#A9A9B0;">WED</div>
        <div style="font-size:15px;font-weight:800;">23</div>
      </div>
      <div class="date-chip" data-date="Thu, Sep 24" onclick="pickDate(this)">
        <div style="font-size:11px;color:#A9A9B0;">THU</div>
        <div style="font-size:15px;font-weight:800;">24</div>
      </div>
      <div class="date-chip" data-date="Fri, Sep 25" onclick="pickDate(this)">
        <div style="font-size:11px;color:#A9A9B0;">FRI</div>
        <div style="font-size:15px;font-weight:800;">25</div>
      </div>
      <div class="date-chip" data-date="Sat, Sep 26" onclick="pickDate(this)">
        <div style="font-size:11px;color:#A9A9B0;">SAT</div>
        <div style="font-size:15px;font-weight:800;">26</div>
      </div>
    </div>

    <span style="font-size:11px;font-weight:700;color:#8B8B92;letter-spacing:0.04em;">AVAILABLE TIMES</span>
    <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin-top:10px;">
      <div class="slot off" data-time="10:00 AM">10:00 AM</div>
      <div class="slot" data-time="11:30 AM" onclick="pickSlot(this)">11:30 AM</div>
      <div class="slot" data-time="1:00 PM" onclick="pickSlot(this)">1:00 PM</div>
      <div class="slot off" data-time="2:00 PM">2:00 PM</div>
      <div class="slot on" data-time="2:30 PM" onclick="pickSlot(this)">2:30 PM</div>
      <div class="slot" data-time="4:00 PM" onclick="pickSlot(this)">4:00 PM</div>
      <div class="slot" data-time="5:30 PM" onclick="pickSlot(this)">5:30 PM</div>
      <div class="slot off" data-time="6:30 PM">6:30 PM</div>
      <div class="slot" data-time="7:00 PM" onclick="pickSlot(this)">7:00 PM</div>
    </div>
  </div>

  <div style="flex-shrink:0;padding:12px 20px 28px 20px;">
    <a href="confirm.html" onclick="saveTime()" style="display:block;text-align:center;background:#FF2E9E;color:#fff;font-size:15px;font-weight:800;padding:16px 0;border-radius:16px;box-shadow:0 10px 24px rgba(255,46,158,0.4);">Continue</a>
  </div>

</div>
<script>
  function pickDate(el) {
    document.querySelectorAll('.date-chip').forEach(d => d.classList.remove('on'));
    el.classList.add('on');
  }
  function pickSlot(el) {
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('on'));
    el.classList.add('on');
  }
  function saveTime() {
    const date = document.querySelector('.date-chip.on').dataset.date;
    const time = document.querySelector('.slot.on').dataset.time;
    sessionStorage.setItem('nv_time', JSON.stringify({ date, time }));
  }
  const svc = JSON.parse(sessionStorage.getItem('nv_service') || 'null');
  if (svc) document.getElementById('svc-sub').textContent = svc.name + ' · ' + svc.duration + ' · $' + svc.price;
</script>
</body>
</html>
