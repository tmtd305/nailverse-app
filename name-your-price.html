<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Nailverse — Name Your Price</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#150E13"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="notifications.js"></script>
<style>
  body{margin:0;background:#150E13;}
  *{box-sizing:border-box;}
  a{text-decoration:none;color:inherit;}
  input,textarea{font-family:'Manrope',sans-serif;}
  input::placeholder,textarea::placeholder{color:#7C6E7A;}
  .toggle{width:42px;height:24px;border-radius:100px;background:#2A1F2B;position:relative;cursor:pointer;flex-shrink:0;}
  .toggle .dot{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#7C6E7A;transition:all .15s;}
  .toggle.on{background:#FF2E9E;}
  .toggle.on .dot{left:20px;background:#fff;}
</style>
</head>
<body>
<div style="width:100%;max-width:430px;margin:0 auto;height:100vh;height:100dvh;background:#150E13;font-family:'Manrope',sans-serif;color:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="flex-shrink:0;padding:18px 20px 6px 20px;">
    <a href="match-results.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1 style="font-size:23px;font-weight:800;margin:14px 0 4px 0;">Name Your Price</h1>
    <p style="font-size:12.5px;color:#B9A8B8;margin:0;line-height:1.5;">Tell us what you want, and nail techs can send you offers.</p>
  </div>

  <div style="flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px;">

    <img src="images/n5.jpg" style="width:64px;height:64px;border-radius:14px;object-fit:cover;flex-shrink:0;">

    <div style="flex-shrink:0;">
      <span style="font-size:12px;font-weight:700;color:#B9A8B8;">Describe your nail set</span>
      <textarea style="width:100%;background:#1F1620;border:none;border-radius:14px;padding:12px 14px;margin-top:6px;font-size:12.5px;color:#D8CBD7;line-height:1.5;resize:none;" rows="3">Long almond, pink chrome with 3D flowers similar to this photo. Need it this weekend.</textarea>
    </div>

    <div style="display:flex;gap:10px;flex-shrink:0;">
      <div style="flex:1;">
        <span style="font-size:12px;font-weight:700;color:#B9A8B8;">Your Budget (Optional)</span>
        <div style="background:#1F1620;border-radius:12px;padding:12px 14px;margin-top:6px;display:flex;align-items:center;gap:4px;">
          <span style="color:#7C6E7A;font-size:13px;">$</span>
          <input type="number" value="80" style="background:transparent;border:none;color:#fff;font-size:13.5px;font-weight:700;width:100%;outline:none;">
        </div>
      </div>
      <div style="flex:1;">
        <span style="font-size:12px;font-weight:700;color:#B9A8B8;">Preferred Date</span>
        <div style="background:#1F1620;border-radius:12px;padding:10px 14px;margin-top:6px;">
          <input type="date" value="2026-04-26" style="background:transparent;border:none;color:#fff;font-size:12px;font-weight:600;width:100%;outline:none;color-scheme:dark;">
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
      <span style="font-size:13.5px;font-weight:600;">In Salon</span>
      <div class="toggle" id="toggle-salon" onclick="setMode('salon')"><div class="dot"></div></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
      <span style="font-size:13.5px;font-weight:600;">Mobile (Comes to Me)</span>
      <div class="toggle on" id="toggle-mobile" onclick="setMode('mobile')"><div class="dot"></div></div>
    </div>

  </div>

  <div style="flex-shrink:0;padding:10px 20px 28px 20px;">
    <a href="match-results.html" style="display:block;text-align:center;background:#FF2E9E;color:#fff;font-size:15px;font-weight:800;padding:16px 0;border-radius:16px;box-shadow:0 10px 24px rgba(255,46,158,0.45);">Send Request</a>
    <p style="font-size:11px;color:#7C6E7A;text-align:center;margin:12px 0 0 0;">Nail techs near you will be notified and can send you their offers.</p>
  </div>

</div>
<script>
  function setMode(mode) {
    document.getElementById('toggle-salon').classList.toggle('on', mode === 'salon');
    document.getElementById('toggle-mobile').classList.toggle('on', mode === 'mobile');
  }
</script>
</body>
</html>
