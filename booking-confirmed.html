<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Nailverse — Booked</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0A0A0B"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap">
<script src="notifications.js"></script>
<style>html,body{margin:0;background:#0A0A0B;overflow-x:hidden;}*{box-sizing:border-box;}a{text-decoration:none;color:inherit;}</style>
</head>
<body>
<div style="width:100%;max-width:430px;margin:0 auto;height:100vh;height:100dvh;background:#0A0A0B;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="flex-shrink:0;background:linear-gradient(160deg,#1E1418,#0A0A0B);padding:44px 24px 30px 24px;text-align:center;position:relative;">
    <a href="home.html" style="position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:50%;background:#18181B;display:flex;align-items:center;justify-content:center;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <div style="width:64px;height:64px;border-radius:50%;background:#FF2E9E;display:flex;align-items:center;justify-content:center;margin:0 auto 16px auto;box-shadow:0 10px 30px rgba(255,46,158,0.4);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1 style="font-size:24px;font-weight:800;margin:0 0 6px 0;">You're booked!</h1>
    <p style="font-size:13px;color:#A9A9B0;margin:0;">Confirmation sent to your phone</p>
  </div>

  <div style="flex:1;overflow-y:auto;padding:20px 20px;display:flex;flex-direction:column;gap:14px;">

    <div style="background:#18181B;border-radius:16px;padding:16px;">
      <div style="display:flex;gap:12px;align-items:center;">
        <img src="images/ig-profile.jpg" style="width:48px;height:48px;border-radius:50%;object-fit:cover;">
        <div>
          <div style="font-size:14px;font-weight:700;">2Cute Nails</div>
          <div style="font-size:11.5px;color:#8B8B92;">★ 5.0 · Mobile nail studio</div>
        </div>
      </div>
      <div style="height:1px;background:#232326;margin:14px 0;"></div>
      <div style="display:flex;flex-direction:column;gap:11px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FF2E9E" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
          <span id="d-datetime" style="font-size:13px;">—</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FF2E9E" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span style="font-size:13px;">Your address · Miami Beach</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FF2E9E" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span id="d-service" style="font-size:13px;">—</span>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:10px;">
      <a href="#" onclick="event.preventDefault();showToast('Added to calendar')" style="flex:1;background:#18181B;border-radius:14px;padding:13px 0;text-align:center;font-size:13px;font-weight:700;">Add to Calendar</a>
      <a href="#" onclick="event.preventDefault();showToast('Messaging coming soon')" style="flex:1;background:#18181B;border-radius:14px;padding:13px 0;text-align:center;font-size:13px;font-weight:700;">Message Tech</a>
    </div>

    <a href="navigation.html" style="border-radius:16px;overflow:hidden;position:relative;display:block;min-height:110px;">
      <img src="images/miami-map.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.2) brightness(0.5);">
      <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,6,7,0.85),rgba(6,6,7,0.35));"></div>
      <div style="position:absolute;left:16px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;color:#fff;">
        <div style="font-size:11.5px;color:#C9C9CF;">Tap to track</div>
        <div style="font-size:15px;font-weight:800;">2Cute Nails is on the way</div>
      </div>
      <div style="position:absolute;right:16px;top:0;bottom:0;display:flex;align-items:center;">
        <div style="width:34px;height:34px;border-radius:50%;background:#FF2E9E;display:flex;align-items:center;justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>
        </div>
      </div>
    </a>

  </div>

</div>
<script>
  const svc = JSON.parse(sessionStorage.getItem('nv_service') || '{"name":"Full Set — Acrylic"}');
  const time = JSON.parse(sessionStorage.getItem('nv_time') || '{"date":"Today, Sep 22","time":"2:30 PM"}');
  const total = sessionStorage.getItem('nv_total') || '95';
  document.getElementById('d-datetime').textContent = time.date + ' · ' + time.time;
  document.getElementById('d-service').textContent = '$' + total + ' · ' + svc.name;
</script>
</body>
</html>
