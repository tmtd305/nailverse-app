<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Nailverse — On the way</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0A0A0B"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap">
<script src="notifications.js"></script>
<style>body{margin:0;background:#0A0A0B;}*{box-sizing:border-box;}a{text-decoration:none;color:inherit;}*{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
a,button{transition:transform .15s ease,opacity .15s ease;-webkit-tap-highlight-color:transparent;}
a:active,button:active{transform:scale(0.96);opacity:0.82;}
</style>
</head>
<body>
<div style="width:100%;max-width:430px;margin:0 auto;height:100vh;height:100dvh;background:#0A0A0B;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="flex:1;position:relative;overflow:hidden;">
    <img src="images/miami-map.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s ease;filter:saturate(1.3) brightness(0.55);" onload="this.style.opacity=1;">
    <div style="position:absolute;inset:0;background:linear-gradient(150deg,rgba(6,6,7,0.72) 0%,rgba(14,14,16,0.5) 45%,rgba(4,4,5,0.7) 100%);"></div>

    <svg style="position:absolute;left:0;top:0;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.5));" width="390" height="620" viewBox="0 0 390 620" fill="none">
      <path d="M300 170 C 230 260, 250 340, 170 420 S 100 540, 130 570" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    </svg>

    <div style="position:absolute;left:283px;top:150px;width:14px;height:14px;border-radius:50%;background:#3B82F6;box-shadow:0 0 0 6px rgba(59,130,246,0.18);border:2px solid #fff;"></div>
    <div style="position:absolute;left:112px;top:558px;width:34px;height:34px;border-radius:50% 50% 50% 0;background:#FF3D94;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,0.4);">
      <img src="images/ig-profile.jpg" style="position:absolute;inset:4px;width:22px;height:22px;border-radius:50%;object-fit:cover;transform:rotate(45deg);">
    </div>

    <div style="position:absolute;top:20px;left:20px;right:20px;background:#232326;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;">
      <div style="width:38px;height:38px;border-radius:11px;background:#FF3D94;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div>
        <div style="font-size:16px;font-weight:800;">0.4 mi</div>
        <div style="font-size:11.5px;color:#A9A9B0;">Turn right onto Collins Ave</div>
      </div>
    </div>

    <div style="position:absolute;right:16px;top:96px;display:flex;flex-direction:column;gap:8px;">
      <button onclick="showToast('Sound muted')" style="all:unset;width:34px;height:34px;border-radius:50%;background:#232326;display:flex;align-items:center;justify-content:center;cursor:pointer;box-sizing:border-box;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      </button>
      <button onclick="showToast('Recentering map')" style="all:unset;width:34px;height:34px;border-radius:50%;background:#232326;display:flex;align-items:center;justify-content:center;cursor:pointer;box-sizing:border-box;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
      <button onclick="showToast('3D view coming soon')" style="all:unset;width:34px;height:34px;border-radius:50%;background:#232326;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;cursor:pointer;box-sizing:border-box;">3D</button>
    </div>
  </div>

  <div style="flex-shrink:0;background:#18181B;border-radius:22px 22px 0 0;padding:16px 18px 22px 18px;box-shadow:0 -12px 30px rgba(0,0,0,0.35);position:relative;">
    <a href="home.html" style="position:absolute;top:14px;right:16px;width:26px;height:26px;border-radius:50%;background:#2A2A2E;display:flex;align-items:center;justify-content:center;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <div style="display:flex;gap:10px;align-items:center;">
      <img src="images/ig-profile.jpg" style="width:44px;height:44px;border-radius:50%;object-fit:cover;">
      <div>
        <div style="font-size:14px;font-weight:700;">2Cute Nails</div>
        <div style="font-size:11.5px;color:#A9A9B0;">1234 Collins Ave, Miami Beach, FL</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;">
      <div>
        <div style="font-size:26px;font-weight:800;">5 min</div>
        <div style="font-size:11.5px;color:#A9A9B0;">1.2 mi · Arrive at 10:24 AM</div>
      </div>
      <a href="home.html" style="background:#FF3D94;color:#fff;font-size:13px;font-weight:800;padding:11px 24px;border-radius:12px;">End</a>
    </div>
  </div>

</div>
</body>
</html>
