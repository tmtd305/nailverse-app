<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Nailverse — Nail SOS</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0A0A0B"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap">
<script src="notifications.js"></script>
<style>body{margin:0;background:#0A0A0B;}*{box-sizing:border-box;}a{text-decoration:none;color:inherit;}</style>
</head>
<body>
<div style="width:100%;max-width:430px;margin:0 auto;height:100vh;height:100dvh;background:radial-gradient(ellipse at top,#1A1113 0%,#0A0A0B 55%);font-family:'Plus Jakarta Sans',sans-serif;color:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="flex-shrink:0;padding:18px 20px 4px 20px;display:flex;align-items:center;justify-content:space-between;">
    <a href="home.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span style="font-size:10.5px;font-weight:700;color:#5A5A60;">Soon</span>
  </div>

  <div style="flex-shrink:0;text-align:center;padding:10px 30px 6px 30px;">
    <div style="width:56px;height:56px;border-radius:50%;background:#E11D48;display:flex;align-items:center;justify-content:center;margin:0 auto 14px auto;box-shadow:0 0 0 10px rgba(225,29,72,0.15);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M12 2a5 5 0 0 0-5 5v4a5 5 0 0 0 10 0V7a5 5 0 0 0-5-5z"/><path d="M9 21l1.5-6M15 21l-1.5-6"/></svg>
    </div>
    <h1 style="font-size:24px;font-weight:800;color:#FB7185;margin:0 0 8px 0;">Nail SOS</h1>
    <h2 style="font-size:17px;font-weight:700;margin:0 0 8px 0;">Nail Emergency?</h2>
    <p style="font-size:12.5px;color:#A9A9B0;line-height:1.5;margin:0;">Find available nail techs near you for urgent fixes, repairs or last-minute sets.</p>
  </div>

  <div style="flex:1;padding:22px 24px;display:flex;flex-direction:column;gap:14px;overflow:hidden;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;flex-shrink:0;">
      <a href="#" onclick="return pick(this)" style="background:#1C1416;border:1px solid #3A2226;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FB7185" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        <span style="font-size:13px;font-weight:700;">Broken Nail</span>
      </a>
      <a href="#" onclick="return pick(this)" style="background:#1C1416;border:1px solid #3A2226;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FB7185" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
        <span style="font-size:13px;font-weight:700;">Event Tomorrow</span>
      </a>
      <a href="#" onclick="return pick(this)" style="background:#1C1416;border:1px solid #3A2226;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FB7185" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span style="font-size:13px;font-weight:700;">Last-Minute Set</span>
      </a>
      <a href="#" onclick="return pick(this)" style="background:#1C1416;border:1px solid #3A2226;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FB7185" stroke-width="2"><path d="M19 14c1.5-1.5 3-3.5 3-6a4 4 0 0 0-7-2.7A4 4 0 0 0 8 8c0 2.5 1.5 4.5 3 6l3.5 4z"/><path d="M5 14l4 4-3 3-4-4z"/></svg>
        <span style="font-size:13px;font-weight:700;">Nail Repair</span>
      </a>
    </div>
  </div>

  <div style="flex-shrink:0;padding:10px 24px 30px 24px;">
    <a href="coming-soon.html?feature=sos" style="display:block;text-align:center;background:linear-gradient(135deg,#FF2E9E,#E11D48);color:#fff;font-size:15px;font-weight:800;padding:16px 0;border-radius:16px;box-shadow:0 10px 24px rgba(225,29,72,0.4);">Find Help Now</a>
    <p style="font-size:11.5px;color:#8B8B92;text-align:center;margin:12px 0 0 0;">Because bad nails can't wait.</p>
  </div>

</div>
<script>
  function pick(el) {
    document.querySelectorAll('a[onclick]').forEach(a => a.style.borderColor = '#3A2226');
    el.style.borderColor = '#FF2E9E';
    return false;
  }
</script>
</body>
</html>
