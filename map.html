<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Nailverse — Map</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0A0A0B"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<script src="notifications.js"></script>
<style>body{margin:0;background:#0A0A0B;}*{box-sizing:border-box;}a{text-decoration:none;color:inherit;}</style>
</head>
<body>
<div style="width:100%;max-width:430px;margin:0 auto;height:100vh;height:100dvh;background:#0A0A0B;font-family:'Inter',sans-serif;color:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="position:absolute;top:0;left:0;right:0;z-index:5;padding:16px 16px 10px 16px;">
    <div style="display:flex;align-items:center;gap:8px;">
      <button onclick="showToast('Search coming soon')" style="all:unset;flex:1;display:flex;align-items:center;gap:8px;background:#18181B;border-radius:12px;padding:12px 14px;cursor:pointer;box-sizing:border-box;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9A9B0" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span style="font-size:13px;font-weight:600;flex:1;color:#fff;">Miami, FL</span>
      </button>
      <button onclick="showToast('Advanced filters coming soon')" style="all:unset;background:#18181B;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:6px;cursor:pointer;box-sizing:border-box;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
        <span style="font-size:12px;font-weight:700;color:#fff;">Filters</span>
      </button>
    </div>
    <div id="map-chips" style="display:flex;gap:8px;margin-top:10px;overflow-x:auto;">
      <button onclick="setChip(this)" data-active="true" style="all:unset;background:#FF2E9E;color:#fff;font-size:12px;font-weight:700;padding:8px 15px;border-radius:100px;white-space:nowrap;cursor:pointer;box-sizing:border-box;">All</button>
      <button onclick="setChip(this)" style="all:unset;background:#18181B;color:#A9A9B0;font-size:12px;font-weight:700;padding:8px 15px;border-radius:100px;white-space:nowrap;cursor:pointer;box-sizing:border-box;">Acrylic</button>
      <button onclick="setChip(this)" style="all:unset;background:#18181B;color:#A9A9B0;font-size:12px;font-weight:700;padding:8px 15px;border-radius:100px;white-space:nowrap;cursor:pointer;box-sizing:border-box;">Gel</button>
      <button onclick="setChip(this)" style="all:unset;background:#18181B;color:#A9A9B0;font-size:12px;font-weight:700;padding:8px 15px;border-radius:100px;white-space:nowrap;cursor:pointer;box-sizing:border-box;">Nail Art</button>
      <button onclick="setChip(this)" style="all:unset;background:#18181B;color:#A9A9B0;font-size:12px;font-weight:700;padding:8px 15px;border-radius:100px;white-space:nowrap;cursor:pointer;box-sizing:border-box;">Pedicure</button>
    </div>
  </div>

  <div style="flex:1;position:relative;overflow:hidden;">
    <img src="images/miami-map.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s ease;filter:saturate(1.3) brightness(0.6);" onload="this.style.opacity=1;">
    <div style="position:absolute;inset:0;background:linear-gradient(150deg,rgba(6,6,7,0.72) 0%,rgba(14,14,16,0.5) 45%,rgba(4,4,5,0.7) 100%);"></div>

    <span style="position:absolute;left:20px;top:200px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.6);">Wynwood</span>
    <span style="position:absolute;left:250px;top:150px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.6);">Miami</span>
    <span style="position:absolute;left:230px;top:330px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.6);">South Beach</span>
    <span style="position:absolute;left:40px;top:395px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.6);">Miami<br>Brickell</span>

    <button onclick="showToast('3D view coming soon')" style="all:unset;position:absolute;right:16px;top:16px;background:rgba(24,24,27,0.9);backdrop-filter:blur(4px);border-radius:10px;padding:8px 12px;font-size:11px;font-weight:800;color:#fff;cursor:pointer;box-sizing:border-box;">3D</button>
    <button onclick="showToast('Centering on your location')" style="all:unset;position:absolute;right:16px;top:60px;width:34px;height:34px;border-radius:50%;background:rgba(24,24,27,0.9);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;cursor:pointer;box-sizing:border-box;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 11l19-9-9 19-2-8z"/></svg>
    </button>

    <a href="profile.html" style="position:absolute;left:98px;top:150px;width:34px;height:34px;border-radius:50% 50% 50% 0;background:#fff;transform:rotate(-45deg);box-shadow:0 6px 14px rgba(0,0,0,0.5);">
      <img src="images/n2.jpg" style="position:absolute;inset:3px;width:28px;height:28px;border-radius:50%;object-fit:cover;transform:rotate(45deg);">
    </a>
    <a href="profile.html" style="position:absolute;left:200px;top:200px;width:34px;height:34px;border-radius:50% 50% 50% 0;background:#fff;transform:rotate(-45deg);box-shadow:0 6px 14px rgba(0,0,0,0.5);">
      <img src="images/ig-profile.jpg" style="position:absolute;inset:3px;width:28px;height:28px;border-radius:50%;object-fit:cover;transform:rotate(45deg);">
    </a>
    <a href="profile.html" style="position:absolute;left:90px;top:290px;width:44px;height:44px;border-radius:50% 50% 50% 0;background:#FF2E9E;transform:rotate(-45deg);box-shadow:0 4px 14px rgba(0,0,0,0.45);border:3px solid #fff;">
      <img src="images/ig-profile.jpg" style="position:absolute;inset:5px;width:26px;height:26px;border-radius:50%;object-fit:cover;transform:rotate(45deg);">
    </a>
  </div>

  <div style="flex-shrink:0;background:#18181B;border-radius:22px 22px 0 0;padding:16px 18px 22px 18px;box-shadow:0 -12px 30px rgba(0,0,0,0.35);">
    <div style="display:flex;gap:10px;align-items:center;">
      <div style="position:relative;flex-shrink:0;">
        <img src="images/ig-profile.jpg" style="width:50px;height:50px;border-radius:50%;object-fit:cover;">
        <span style="position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;background:#4ADE80;border:2px solid #18181B;"></span>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:4px;">
          <span style="font-size:14.5px;font-weight:700;">2Cute Nails</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="#3B82F6"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6" stroke="#fff" stroke-width="2" fill="none"/></svg>
        </div>
        <div style="font-size:11.5px;color:#A9A9B0;margin-top:1px;"><span style="color:#FF2E9E;">★</span> 5.0 (328) · 0.8 mi</div>
        <div style="font-size:11px;color:#4ADE80;font-weight:600;">Available now</div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div style="font-size:13px;font-weight:800;">$65–95</div>
        <div style="font-size:10px;color:#8B8B92;">avg. set</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <img src="images/ig-post1.jpg" loading="lazy" style="width:78px;height:56px;border-radius:12px;object-fit:cover;">
      <img src="images/ig-post2.jpg" loading="lazy" style="width:78px;height:56px;border-radius:12px;object-fit:cover;">
      <img src="images/ig-post3.jpg" loading="lazy" style="width:78px;height:56px;border-radius:12px;object-fit:cover;">
    </div>
    <a href="profile.html" style="display:block;text-align:center;margin-top:14px;background:#FF2E9E;color:#fff;font-size:14px;font-weight:700;padding:13px 0;border-radius:12px;box-shadow:0 10px 24px rgba(255,46,158,0.45);">View Profile</a>
  </div>

</div>
<script>
  function setChip(el) {
    document.querySelectorAll('#map-chips button').forEach(b => {
      b.style.background = '#18181B';
      b.style.color = '#A9A9B0';
    });
    el.style.background = '#FF2E9E';
    el.style.color = '#fff';
  }
</script>
</body>
</html>
