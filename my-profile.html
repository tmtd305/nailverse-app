<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Nailverse — My Profile</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0A0A0B"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap">
<script src="notifications.js"></script>
<style>
  html,body{margin:0;background:#0A0A0B;overflow-x:hidden;}
  *{box-sizing:border-box;}
  a{text-decoration:none;color:inherit;}
  ::-webkit-scrollbar{display:none;}
  .ptab{font-size:12px;font-weight:700;color:#8B8B92;padding:11px 0;flex:1;text-align:center;cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px;}
  .ptab.on{color:#fff;border-color:#FF2E9E;}
</style>
</head>
<body>
<div style="width:100%;max-width:430px;margin:0 auto;height:100vh;height:100dvh;background:#0A0A0B;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="flex-shrink:0;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;">
    <a href="home.html" style="width:32px;height:32px;border-radius:50%;background:#18181B;display:flex;align-items:center;justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span style="font-size:14px;font-weight:800;">@you</span>
    <a href="create-post.html" style="width:32px;height:32px;border-radius:50%;background:#18181B;display:flex;align-items:center;justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
    </a>
  </div>

  <div style="flex:1;overflow-y:auto;overflow-x:hidden;">

    <div style="padding:4px 20px 0 20px;display:flex;align-items:center;gap:16px;">
      <div style="position:relative;flex-shrink:0;">
        <img src="images/ig-profile.jpg" style="width:78px;height:78px;border-radius:50%;object-fit:cover;border:2px solid #232326;">
        <div style="position:absolute;bottom:0;right:0;width:24px;height:24px;border-radius:50%;background:#FF2E9E;border:2.5px solid #0A0A0B;display:flex;align-items:center;justify-content:center;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </div>
      <div style="flex:1;display:flex;justify-content:space-around;text-align:center;">
        <div><div id="stat-posts" style="font-size:16px;font-weight:800;">6</div><div style="font-size:10.5px;color:#8B8B92;">Posts</div></div>
        <div><div style="font-size:16px;font-weight:800;">184</div><div style="font-size:10.5px;color:#8B8B92;">Followers</div></div>
        <div><div style="font-size:16px;font-weight:800;">96</div><div style="font-size:10.5px;color:#8B8B92;">Following</div></div>
      </div>
    </div>

    <div style="padding:14px 20px 0 20px;">
      <div style="font-size:14.5px;font-weight:800;">You</div>
      <p style="margin:4px 0 0 0;font-size:12.5px;line-height:1.5;color:#A9A9B0;">Building my nail history 💅 Miami, FL</p>
    </div>

    <div style="padding:14px 20px 18px 20px;display:flex;gap:8px;">
      <a href="#" onclick="event.preventDefault();showToast('Edit profile coming soon')" style="flex:1;background:#18181B;color:#fff;font-size:13px;font-weight:700;text-align:center;padding:11px 0;border-radius:12px;">Edit Profile</a>
      <a href="create-post.html" style="flex:1;background:#FF2E9E;color:#fff;font-size:13px;font-weight:700;text-align:center;padding:11px 0;border-radius:12px;box-shadow:0 8px 20px rgba(255,46,158,0.35);">New Post</a>
    </div>

    <div style="display:flex;padding:0 20px;border-bottom:1px solid #1E1E21;">
      <div class="ptab on" data-tab="posts" onclick="setPTab(this)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg> Posts
      </div>
      <div class="ptab" data-tab="saved" onclick="setPTab(this)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> Saved
      </div>
      <div class="ptab" data-tab="tagged" onclick="setPTab(this)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg> Tagged
      </div>
    </div>

    <div id="posts-empty" style="display:none;flex-direction:column;align-items:center;gap:10px;padding:44px 30px;text-align:center;">
      <div style="width:52px;height:52px;border-radius:50%;background:#18181B;display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A5A60" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div style="font-size:13.5px;font-weight:700;">Start your nail history</div>
      <p style="margin:0;font-size:12px;color:#8B8B92;line-height:1.5;">Post your first look — tag the tech who did it and add hashtags so others can find it.</p>
      <a href="create-post.html" style="margin-top:4px;background:#FF2E9E;color:#fff;font-size:12.5px;font-weight:700;padding:10px 20px;border-radius:100px;">New Post</a>
    </div>

    <div id="posts-grid" style="display:grid;grid-template-columns:repeat(3, 1fr);gap:2px;padding-top:2px;"></div>

  </div>

  <div style="flex-shrink:0;height:64px;display:flex;align-items:center;justify-content:space-around;background:#0A0A0B;border-top:1px solid #232326;">
    <a href="home.html"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8B8B92" stroke-width="2.2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></a>
    <a href="map.html"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8B8B92" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></a>
    <a href="match-upload.html" style="width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#FF2E9E,#FF8A5B);display:flex;align-items:center;justify-content:center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
    </a>
    <a href="#" onclick="event.preventDefault();showToast('Favorites coming soon')"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8B8B92" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6z"/></svg></a>
    <a href="my-profile.html"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg></a>
  </div>

</div>
<script>
  const seedPosts = [
    {img:'images/ig-post3.jpg', kind:'photo'},
    {img:'images/ig-post6.jpg', kind:'video'},
    {img:'images/ig-post4.jpg', kind:'photo'},
    {img:'images/ig-post1.jpg', kind:'photo'},
    {img:'images/ig-post2.jpg', kind:'video'},
    {img:'images/ig-post5.jpg', kind:'photo'}
  ];
  const savedSeed = [
    {img:'images/ig-post9.jpg'},{img:'images/ig-post10.jpg'},{img:'images/ig-post7.jpg'},{img:'images/ig-post8.jpg'}
  ];

  function getMyPosts() {
    try { return JSON.parse(localStorage.getItem('nv_myposts') || '[]'); } catch(e) { return []; }
  }

  function renderCell(img, kind) {
    const cell = document.createElement('div');
    cell.style.cssText = 'position:relative;aspect-ratio:1/1;overflow:hidden;background:#18181B;';
    cell.innerHTML = '<img src="' + img + '" loading="lazy" style="width:100%;height:100%;object-fit:cover;">' +
      (kind === 'video' ? '<span style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.55);border-radius:5px;padding:2px 5px;"><svg width="10" height="10" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span>' : '');
    return cell;
  }

  function renderPosts() {
    const mine = getMyPosts();
    const grid = document.getElementById('posts-grid');
    grid.innerHTML = '';
    const all = mine.map(p => ({img: p.image, kind: p.kind || 'photo'})).concat(seedPosts);
    document.getElementById('stat-posts').textContent = all.length;
    if (all.length === 0) {
      document.getElementById('posts-empty').style.display = 'flex';
      grid.style.display = 'none';
      return;
    }
    document.getElementById('posts-empty').style.display = 'none';
    grid.style.display = 'grid';
    all.forEach(p => grid.appendChild(renderCell(p.img, p.kind)));
  }

  function renderSaved() {
    const grid = document.getElementById('posts-grid');
    grid.innerHTML = '';
    document.getElementById('posts-empty').style.display = 'none';
    grid.style.display = 'grid';
    savedSeed.forEach(p => grid.appendChild(renderCell(p.img, 'photo')));
  }

  function renderTagged() {
    const grid = document.getElementById('posts-grid');
    grid.innerHTML = '';
    grid.style.display = 'grid';
    document.getElementById('posts-empty').style.display = 'none';
    [{img:'images/ig-post1.jpg'}].forEach(p => grid.appendChild(renderCell(p.img, 'photo')));
  }

  function setPTab(el) {
    document.querySelectorAll('.ptab').forEach(t => t.classList.remove('on'));
    el.classList.add('on');
    const tab = el.dataset.tab;
    if (tab === 'posts') renderPosts();
    else if (tab === 'saved') renderSaved();
    else renderTagged();
  }

  renderPosts();
</script>
</body>
</html>
