<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Nailverse — My Profile</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0A0A0B"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="notifications.js"></script>
<style>
  html,body{margin:0;background:#0A0A0B;overflow-x:hidden;}
  *{box-sizing:border-box;}
  a{text-decoration:none;color:inherit;}
  ::-webkit-scrollbar{display:none;}
  .ptab{font-size:12px;font-weight:700;color:#8B8B92;padding:11px 0;flex:1;text-align:center;cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px;}
  .ptab.on{color:#fff;border-color:#FF3D94;}
*{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
a,button{transition:transform .15s ease,opacity .15s ease;-webkit-tap-highlight-color:transparent;}
a:active,button:active{transform:scale(0.96);opacity:0.82;}
</style>
</head>
<body>
<div style="width:100%;max-width:430px;margin:0 auto;height:100vh;height:100dvh;background:#0A0A0B;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="flex-shrink:0;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;">
    <a href="home.html" style="width:32px;height:32px;border-radius:50%;background:#18181B;display:flex;align-items:center;justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span id="username-label" style="font-size:14px;font-weight:800;">@you</span>
    <a href="create-post.html" style="width:32px;height:32px;border-radius:50%;background:#18181B;display:flex;align-items:center;justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
    </a>
  </div>

  <div id="loading-state" style="flex:1;display:flex;align-items:center;justify-content:center;">
    <span style="font-size:12.5px;color:#8B8B92;">Loading profile…</span>
  </div>

  <div id="profile-content" style="flex:1;overflow-y:auto;overflow-x:hidden;display:none;">

    <div style="padding:4px 20px 0 20px;display:flex;align-items:center;gap:16px;">
      <div style="position:relative;flex-shrink:0;">
        <img id="avatar-img" src="images/ig-profile.jpg" style="width:78px;height:78px;border-radius:50%;object-fit:cover;border:2px solid #232326;">
        <div style="position:absolute;bottom:0;right:0;width:24px;height:24px;border-radius:50%;background:#FF3D94;border:2.5px solid #0A0A0B;display:flex;align-items:center;justify-content:center;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </div>
      <div style="flex:1;display:flex;justify-content:space-around;text-align:center;">
        <div><div id="stat-posts" style="font-size:16px;font-weight:800;">0</div><div style="font-size:10.5px;color:#8B8B92;">Posts</div></div>
        <div><div id="stat-followers" style="font-size:16px;font-weight:800;">0</div><div style="font-size:10.5px;color:#8B8B92;">Followers</div></div>
        <div><div id="stat-following" style="font-size:16px;font-weight:800;">0</div><div style="font-size:10.5px;color:#8B8B92;">Following</div></div>
      </div>
    </div>

    <div style="padding:14px 20px 0 20px;">
      <div id="display-name" style="font-size:14.5px;font-weight:800;">You</div>
      <p id="bio-text" style="margin:4px 0 0 0;font-size:12.5px;line-height:1.5;color:#A9A9B0;">Building my nail history 💅</p>
    </div>

    <div style="padding:14px 20px 18px 20px;display:flex;gap:8px;">
      <a href="#" onclick="event.preventDefault();showToast('Edit profile coming soon')" style="flex:1;background:#18181B;color:#fff;font-size:13px;font-weight:700;text-align:center;padding:11px 0;border-radius:12px;">Edit Profile</a>
      <a href="create-post.html" style="flex:1;background:#FF3D94;color:#fff;font-size:13px;font-weight:700;text-align:center;padding:11px 0;border-radius:12px;box-shadow:0 8px 20px rgba(255,61,148,0.35);">New Post</a>
    </div>

    <div style="display:flex;padding:0 20px;border-bottom:1px solid #1E1E21;">
      <div class="ptab on" data-tab="posts" onclick="setPTab(this)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg> Posts
      </div>
      <div class="ptab" data-tab="saved" onclick="setPTab(this)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> Saved
      </div>
      <div class="ptab" data-tab="tagged" onclick="setPTab(this)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg> Tagged
      </div>
    </div>

    <div id="posts-empty" style="display:none;flex-direction:column;align-items:center;gap:10px;padding:44px 30px;text-align:center;">
      <div style="width:52px;height:52px;border-radius:50%;background:#18181B;display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A5A60" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div id="posts-empty-title" style="font-size:13.5px;font-weight:700;">Start your nail history</div>
      <p id="posts-empty-sub" style="margin:0;font-size:12px;color:#8B8B92;line-height:1.5;">Post your first look — tag the tech who did it and add hashtags so others can find it.</p>
      <a id="posts-empty-cta" href="create-post.html" style="margin-top:4px;background:#FF3D94;color:#fff;font-size:12.5px;font-weight:700;padding:10px 20px;border-radius:100px;">New Post</a>
    </div>

    <div id="posts-grid" style="display:grid;grid-template-columns:repeat(3, 1fr);gap:2px;padding-top:2px;"></div>

    <div style="padding:20px;">
      <a href="#" onclick="event.preventDefault();signOut()" style="display:block;text-align:center;font-size:12.5px;font-weight:700;color:#8B8B92;">Log Out</a>
    </div>

  </div>

  <div style="flex-shrink:0;height:64px;display:flex;align-items:center;justify-content:space-around;background:#0A0A0B;border-top:1px solid #232326;">
    <a href="home.html"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8B8B92" stroke-width="2.2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></a>
    <a href="map.html"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8B8B92" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></a>
    <a href="match-upload.html" style="width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#FF3D94,#FF6FAE);display:flex;align-items:center;justify-content:center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
    </a>
    <a href="#" onclick="event.preventDefault();showToast('Favorites coming soon')"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8B8B92" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6z"/></svg></a>
    <a href="my-profile.html"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg></a>
  </div>

</div>
<script>
  let myProfile = null;
  let myPosts = [];

  function renderCell(imgUrl, caption) {
    const cell = document.createElement('div');
    cell.style.cssText = 'position:relative;aspect-ratio:1/1;overflow:hidden;background:#18181B;';
    cell.innerHTML = '<img src="' + imgUrl + '" loading="lazy" style="width:100%;height:100%;object-fit:cover;" title="' + (caption||'').replace(/"/g,'') + '">';
    return cell;
  }

  function renderPosts() {
    const grid = document.getElementById('posts-grid');
    grid.innerHTML = '';
    document.getElementById('stat-posts').textContent = myPosts.length;
    if (myPosts.length === 0) {
      document.getElementById('posts-empty-title').textContent = 'Start your nail history';
      document.getElementById('posts-empty-sub').textContent = 'Post your first look — tag the tech who did it and add hashtags so others can find it.';
      document.getElementById('posts-empty-cta').style.display = 'inline-block';
      document.getElementById('posts-empty').style.display = 'flex';
      grid.style.display = 'none';
      return;
    }
    document.getElementById('posts-empty').style.display = 'none';
    grid.style.display = 'grid';
    myPosts.forEach(p => grid.appendChild(renderCell(p.image_url, p.caption)));
  }

  function renderComingSoon(title) {
    const grid = document.getElementById('posts-grid');
    grid.innerHTML = '';
    grid.style.display = 'none';
    document.getElementById('posts-empty-title').textContent = title;
    document.getElementById('posts-empty-sub').textContent = "This isn't built yet — check back soon.";
    document.getElementById('posts-empty-cta').style.display = 'none';
    document.getElementById('posts-empty').style.display = 'flex';
  }

  function setPTab(el) {
    document.querySelectorAll('.ptab').forEach(t => t.classList.remove('on'));
    el.classList.add('on');
    const tab = el.dataset.tab;
    if (tab === 'posts') renderPosts();
    else if (tab === 'saved') renderComingSoon('Saved looks');
    else renderComingSoon('Tagged posts');
  }

  async function init() {
    const session = await requireAuth('login.html');
    if (!session) return;

    const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    myProfile = profile;

    document.getElementById('username-label').textContent = '@' + profile.username;
    document.getElementById('display-name').textContent = profile.display_name || profile.username;
    document.getElementById('bio-text').textContent = profile.bio || 'Building my nail history 💅';
    if (profile.avatar_url) document.getElementById('avatar-img').src = profile.avatar_url;

    const [{ data: posts }, { count: followers }, { count: following }] = await Promise.all([
      sb.from('posts').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false }),
      sb.from('follows').select('*', { count: 'exact', head: true }).eq('following_id', session.user.id),
      sb.from('follows').select('*', { count: 'exact', head: true }).eq('follower_id', session.user.id)
    ]);

    myPosts = posts || [];
    document.getElementById('stat-followers').textContent = followers || 0;
    document.getElementById('stat-following').textContent = following || 0;

    renderPosts();
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('profile-content').style.display = 'block';
  }

  init();
</script>
</body>
</html>
